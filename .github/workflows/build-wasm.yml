name: build-wasm
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android "/opt/hostedtoolcache/CodeQL" || true
          df -h /
      - name: Build emsdk + deps image
        run: docker build -t buildqemu - < Dockerfile
      - name: Configure + make qemu-system-x86_64.wasm (with PTHREAD_POOL_SIZE fix)
        run: |
          set -x
          docker run --rm -d --name b -v "$PWD":/qemu/:ro buildqemu
          EXTRA_CFLAGS="-O3 -g -Wno-error=unused-command-line-argument -matomics -mbulk-memory -DNDEBUG -DG_DISABLE_ASSERT -D_GNU_SOURCE -sASYNCIFY=1 -pthread -sPROXY_TO_PTHREAD=1 -sPTHREAD_POOL_SIZE=8 -sFORCE_FILESYSTEM -sALLOW_TABLE_GROWTH -sTOTAL_MEMORY=2300MB -sWASM_BIGINT -sMALLOC=mimalloc --js-library=/build/node_modules/xterm-pty/emscripten-pty.js -sEXPORT_ES6=1 -sASYNCIFY_IMPORTS=ffi_call_js"
          docker exec b emconfigure /qemu/configure --static --target-list=x86_64-softmmu --cpu=wasm32 --cross-prefix= --without-default-features --enable-system --with-coroutine=fiber --enable-virtfs --extra-cflags="$EXTRA_CFLAGS" --extra-cxxflags="$EXTRA_CFLAGS" --extra-ldflags="-sEXPORTED_RUNTIME_METHODS=getTempRet0,setTempRet0,addFunction,removeFunction,TTY,FS"
          docker exec b emmake make -j"$(nproc)" qemu-system-x86_64
          mkdir -p out
          docker cp b:/build/qemu-system-x86_64.wasm out/
          docker cp b:/build/qemu-system-x86_64 out/out.js
          docker cp b:/build/qemu-system-x86_64.worker.js out/
          docker kill b || true
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: qemu-wasm-x86_64-pool8
          path: out/
